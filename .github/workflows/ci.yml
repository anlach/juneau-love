# PR gate: runs the two test suites as independent jobs (one fails without
# blocking the other's signal). Both jobs recreate the local development
# setup on an ephemeral runner — Docker is preinstalled on ubuntu-latest,
# so `supabase start` (Docker Compose under the hood) gives each job a
# pristine local Supabase stack with migrations + seed applied.
#
# Check names for branch protection on main: `integration`, `playwright`
# (job ids — the jobs deliberately have no display name, so the check-run
# names stay exactly these).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # supabase/tests/flows.sh — drives the full guest journey (register,
  # confirm, approve, login link, guest content, reject, RLS negatives)
  # through the local stack, including the real edge functions via Kong.
  # It runs `supabase db reset` itself, so no separate reset step.
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase stack
        # A fresh runner pulls ~12 images, and the ECR Public ones rate-limit
        # the shared GitHub runner egress IPs (toomanyrequests) — the CLI's
        # 4s retries are not enough, and it can exit 0 with a half-dead
        # stack. Health-check the API and restart the stack until it is up.
        run: |
          for attempt in 1 2 3 4 5 6; do
            npx supabase start
            if curl -sf http://127.0.0.1:54321/auth/v1/health \
               && curl -s -o /dev/null http://127.0.0.1:54321/rest/v1/; then
              exit 0
            fi
            echo "::warning::Stack not healthy after attempt $attempt/6 — restarting"
            npx supabase stop 2>/dev/null || true
            sleep 60
          done
          npx supabase start

      - name: Integration tests
        run: bash supabase/tests/flows.sh

  # e2e/ — Playwright suite against the production static build (served by
  # the webServer step in playwright.config.ts) with the runner's system
  # Chromium, per the config's executablePath.
  playwright:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase stack
        # See the integration job: ECR Public rate-limits the shared GitHub
        # runner egress IPs, and `supabase start` can exit 0 with a
        # half-dead stack — health-check and retry.
        run: |
          for attempt in 1 2 3 4 5 6; do
            npx supabase start
            if curl -sf http://127.0.0.1:54321/auth/v1/health \
               && curl -s -o /dev/null http://127.0.0.1:54321/rest/v1/; then
              exit 0
            fi
            echo "::warning::Stack not healthy after attempt $attempt/6 — restarting"
            npx supabase stop 2>/dev/null || true
            sleep 60
          done
          npx supabase start

      - name: Playwright e2e tests
        run: npx playwright test

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-artifacts
          path: test-results/
          if-no-files-found: ignore
