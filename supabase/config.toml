# Supabase CLI configuration (local development).
# Everything else is the CLI default; see `supabase <group> <command> --help`.

project_id = "juneau-love"

[api]
# The site talks to PostgREST only through the public schema.
schemas = ["public"]

[auth]
# Match the hosted project (knowledge/api/client-auth.md): 1-day access
# tokens. Locally, email confirmations stay off so the confirmation flow
# can be exercised without a mail provider.
jwt_expiry = 86400
site_url = "http://localhost:3000"

[db]
# Postgres major version of the hosted project; re-verify after the first
# push (SELECT version()) and keep this in sync for local dev.
major_version = 17

[functions.send-login-link]
# Publicly invokable (called with no JWT) — the function itself checks
# eligibility. registration-decision keeps the default (verify_jwt = true);
# it re-verifies the caller is an admin either way.
verify_jwt = false

[functions.notify-registration]
# Publicly invokable (called with no JWT at signup time). Idempotent via
# users.admin_notified_at and it only emails admins about real pending
# registrations, so an anonymous caller gains nothing (see the function
# header).
verify_jwt = false

[edge_runtime.secrets]
# Function env for the local stack: exposed to every local edge function as
# a container env var. (CLI 2.121: `supabase start` rejects
# [functions.<name>.env] — "invalid keys: env" — so the per-function env
# tables are gone; the section name says secrets, but plain local-dev
# values work here too.)
#
# JL_ENV selects the local topology in the function code (_shared/index.ts):
# site URL http://localhost:3000 (must match [auth] site_url — GoTrue
# rewrites a mismatched redirect_to origin to the bare site_url,
# knowledge/platform/project.md) and the local storage S3 settings
# (endpoint http://127.0.0.1:54321, path prefix /storage/v1/s3, region
# "local", the CLI's built-in S3 credentials — see _shared/s3.ts). The
# hosted project leaves JL_ENV unset (= prod: juneau.love + Hippius), so
# no environment-specific value ever has to be set as a project secret —
# that footgun produced the 2026-10-24 localhost SITE_URL bug
# (knowledge/platform/bugs.md). Restart the stack after changing this.
JL_ENV = "dev"

# The juneau-assets bucket is created by supabase/seed.sql (idempotently, on
# every fresh stack boot / `supabase db reset`) — nothing to do manually.
