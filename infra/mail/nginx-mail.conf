# nginx server blocks for mail.juneau.love — TLS front for the HTTP relay.
#
# The VPS already runs nginx (other sites + certbot), so the relay is
# fronted by these blocks instead of Caddy (the old Caddyfile is
# superseded). Merge into the site config (e.g. /etc/nginx/sites-available/
# mail-acme) and reload.
#
# The cert for mail.juneau.love is issued/renewed by certbot webroot:
# the :80 block must keep serving /.well-known/acme-challenge/ from
# /var/www/certbot. The same cert files are used by Maddy's :587
# listener (Option B in maddy.conf) — one cert covers both.

server {
    listen 80;
    server_name mail.juneau.love;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mail.juneau.love;

    ssl_certificate /etc/letsencrypt/live/mail.juneau.love/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.juneau.love/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
