# /etc/maddy/maddy.conf — send-only mail for juneau.love
#
# Two listeners, no local mailboxes (juneau.love receives no mail — there is
# no MX record for it):
#
#   127.0.0.1:25  loopback hand-off from the HTTP relay (relay.ts), which
#                 fronts the Supabase edge functions
#   0.0.0.0:587   STARTTLS submission for Supabase GoTrue (the auth server's
#                 own confirmation/signup emails)
#
# Outbound: direct MX delivery (target.remote) with DKIM signing.
#
# Validate before (re)starting:  sudo maddy config test
# Full context: infra/mail/README.md and knowledge/platform/mail.md
# in the juneau-love repo.

hostname mail.juneau.love

# --- TLS for the :587 listener ---------------------------------------------
# Option A — Maddy-managed ACME, dns-01 challenge (Maddy's only supported
# challenge). Needs an API token for the DNS provider that serves
# juneau.love; supported providers include cloudflare, gandi, digitalocean,
# vultr, hetzner, namecheap (the full list, plus build-tag providers, is at
# https://maddy.email/reference/tls-acme/). Adjust the `dns` block to yours.
tls.loader.acme mail_tls {
    email notify@juneau.love
    agreed
    challenge dns-01
    dns cloudflare {
        api_token "<DNS_PROVIDER_API_TOKEN>"
    }
}

# Option B — a manually managed certificate (acme.sh, Caddy, certbot ...):
# uncomment instead of the ACME loader and skip the token entirely:
#
# tls /etc/maddy/mail.juneau.love.crt /etc/maddy/mail.juneau.love.key
#
# (then reference the file pair directly in the :587 block below)

# --- loopback hand-off from the HTTP relay ----------------------------------
# Loopback-only: the public internet cannot reach this listener, so it stays
# unencrypted and unauthenticated — the relay is the only local writer and
# is the component that enforces the bearer token.
smtp tcp://127.0.0.1:25 {
    default_destination {
        deliver_to remote
    }
}

# --- submission for GoTrue ---------------------------------------------------
# Supabase's auth server is configured with SMTP host mail.juneau.love,
# port 587, user notify@juneau.love (see README.md for the Management API
# call). Credentials live in /etc/maddy/smtp_passwd (`user: <hash>` lines;
# hash from `maddy hash passwd`).
smtp tcp://0.0.0.0:587 {
    tls &mail_tls
    auth pass_table file /etc/maddy/smtp_passwd
    default_destination {
        deliver_to remote
    }
}

# --- outbound: DKIM-sign everything leaving the server -----------------------
# The key is auto-generated on first run and stored under
# /var/lib/maddy/dkim_keys/ together with a .dns file holding the public
# record — publish that file as a TXT record at
# mail._domainkey.juneau.love (selector: `mail`).
modify {
    dkim juneau.love mail
}
